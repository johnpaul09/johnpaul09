<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Form</title>
  <style>
    /* CSS for Login Form */
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .login-container {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      width: 300px;
      text-align: center;
    }

    .login-container h1 {
      margin-bottom: 20px;
    }

    .login-container input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .login-container button {
      width: 100%;
      padding: 10px;
      background-color: blue;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .login-container button:hover {
      background-color: darkblue;
    }

    .login-container a {
      display: block;
      margin-top: 10px;
      color: blue;
      text-decoration: none;
      cursor: pointer;
    }

    /* CSS for Modals */
    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 8px;
      width: 300px;
      text-align: center;
    }

    .modal-content input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .close {
      color: red;
      float: right;
      font-size: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Login Form -->
  <div class="login-container">
    <h1>Login</h1>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p id="error-message" style="color: red; display: none;">Invalid username or password!</p>
    <a onclick="showForgotPassword()">Forgot Password?</a>
    <a onclick="showRegister()">Create an Account</a>
  </div>

  <!-- Forgot Password Modal -->
  <div id="forgotPasswordModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('forgotPasswordModal')">&times;</span>
      <h2>Forgot Password</h2>
      <input type="email" id="forgotEmail" placeholder="Enter your email">
      <button onclick="sendResetLink()">Send Reset Link</button>
    </div>
  </div>

  <!-- Registration Modal -->
  <div id="registerModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('registerModal')">&times;</span>
      <h2>Register</h2>
      <input type="text" id="regUsername" placeholder="Username">
      <input type="email" id="regEmail" placeholder="Email">
      <input type="password" id="regPassword" placeholder="Password">
      <button onclick="register()">Register</button>
    </div>
  </div>

  <script>
    // Login Validation
    function login() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      if (username === "admin" && password === "1234") {
        alert("Login successful!");
        window.location.href = "home.html"; // Redirect to another page
      } else {
        document.getElementById("error-message").style.display = "block";
      }
    }

    // Show Forgot Password Modal
    function showForgotPassword() {
      document.getElementById("forgotPasswordModal").style.display = "flex";
    }

    // Show Registration Modal
    function showRegister() {
      document.getElementById("registerModal").style.display = "flex";
    }

    // Close Modal
    function closeModal(modalId) {
      document.getElementById(modalId).style.display = "none";
    }

    // Forgot Password Action
    function sendResetLink() {
      const email = document.getElementById("forgotEmail").value;
      if (email) {
        alert(`A password reset link has been sent to ${email}`);
        closeModal("forgotPasswordModal");
      } else {
        alert("Please enter your email.");
      }
    }

    // Registration Action
    function register() {
      const username = document.getElementById("regUsername").value;
      const email = document.getElementById("regEmail").value;
      const password = document.getElementById("regPassword").value;

      if (username && email && password) {
        alert("Registration successful!");
        closeModal("registerModal");
      } else {
        alert("Please fill out all fields.");
      }
    }
  </script>
</body>
</html>
